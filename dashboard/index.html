<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AI WhatsApp Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#F5FBF6;
      --surface:#FFFFFF;
      --surface-2:#EAF7EC;
      --border:#D9EFDC;
      --violet:#22B14C;
      --violet-dark:#1A8F3C;
      --violet-light:#6EE38A;
      --coral:#6EE38A;
      --mint:#22B14C;
      --text:#16241A;
      --muted:#6B8072;
      --shadow: 0 8px 24px rgba(34,177,76,.14);
    }
    [data-theme="dark"]{
      --bg:#0A0C0A;
      --surface:#12160F;
      --surface-2:#181F16;
      --border:#28311F;
      --violet:#3DDC5B;
      --violet-dark:#26A83E;
      --violet-light:#7CF598;
      --coral:#7CF598;
      --mint:#3DDC5B;
      --text:#EAF6EC;
      --muted:#7E9484;
      --shadow: 0 8px 28px rgba(61,220,91,.22);
    }
    body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);
      color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;
      transition:background .25s,color .25s}
    h1,h2,.brand,.ct,.cn{font-family:'Sora',system-ui,sans-serif}
    .theme-btn{width:38px;height:38px;border-radius:12px;border:1px solid var(--border);
      background:var(--surface-2);color:var(--text);cursor:pointer;font-size:16px;
      display:flex;align-items:center;justify-content:center}

    /* Header */
    header{background:var(--surface);border-bottom:1px solid var(--border);
      padding:16px 28px;display:flex;align-items:center;justify-content:space-between}
    .brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:12px;color:var(--text)}
    .brand-icon{width:38px;height:38px;border-radius:13px;overflow:hidden;
      box-shadow:var(--shadow)}
    .brand-icon img{width:100%;height:100%;object-fit:cover}
    .right{display:flex;align-items:center;gap:16px;font-size:13px}
    .toggle{position:relative;width:50px;height:28px;cursor:pointer}
    .toggle input{opacity:0;width:0;height:0}
    .slider{position:absolute;inset:0;background:var(--border);border-radius:28px;transition:.25s}
    .slider::before{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;
      background:#fff;border-radius:50%;transition:.25s;box-shadow:0 2px 6px rgba(0,0,0,.15)}
    .toggle input:checked+.slider{background:linear-gradient(135deg,var(--violet),var(--coral))}
    .toggle input:checked+.slider::before{transform:translateX(22px)}
    .pill{font-size:12px;padding:5px 14px;border-radius:20px;font-weight:600;
      background:var(--surface-2);color:var(--muted)}
    .pill.on{background:rgba(0,200,150,.12);color:var(--mint)}
    .pill.warn{background:rgba(255,122,89,.14);color:var(--coral)}

    /* Layout */
    .main{display:flex;flex:1;overflow:hidden}
    .sidebar{width:300px;border-right:1px solid var(--border);
      background:var(--surface);display:flex;flex-direction:column}
    .sidebar h3{padding:18px 20px 10px;font-size:12px;font-weight:700;color:var(--muted);
      text-transform:uppercase;letter-spacing:1px}
    .clist{overflow-y:auto;flex:1;padding:0 10px}
    .contact{padding:12px;cursor:pointer;border-radius:16px;margin-bottom:4px;
      display:flex;align-items:center;gap:12px;transition:background .15s}
    .contact:hover{background:var(--surface-2)}
    .contact.active{background:linear-gradient(135deg,rgba(108,92,231,.10),rgba(255,122,89,.08))}
    .av{width:44px;height:44px;border-radius:14px;flex-shrink:0;
      background:linear-gradient(135deg,var(--violet),var(--violet-light));
      display:flex;align-items:center;justify-content:center;
      font-weight:700;font-size:16px;color:#fff}
    .ci{flex:1;min-width:0}
    .cn{font-size:14px;font-weight:600}
    .cp{font-size:12px;color:var(--muted);white-space:nowrap;
      overflow:hidden;text-overflow:ellipsis;margin-top:2px}
    .cb{font-size:11px;font-weight:700;color:#fff;
      background:var(--coral);padding:3px 8px;border-radius:10px}
    .empty{padding:50px 20px;text-align:center;color:var(--muted);
      font-size:13px;line-height:1.9}

    .panel{flex:1;display:flex;flex-direction:column;background:var(--bg)}
    .chat-head{padding:16px 24px;background:var(--surface);
      border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px}
    .ct{font-weight:700;font-size:16px}
    .cph{font-size:12px;color:var(--muted);margin-top:2px}
    #persona-sel{background:var(--surface-2);color:var(--text);
      border:1px solid var(--border);border-radius:12px;padding:9px 14px;
      font-size:13px;font-weight:600;outline:none;cursor:pointer;font-family:'Inter'}

    .msgs{flex:1;overflow-y:auto;padding:24px;display:flex;flex-direction:column;gap:10px}
    .mw{display:flex}.mw.out{justify-content:flex-end}
    .bbl{max-width:66%;padding:11px 16px;border-radius:20px;
      font-size:14px;line-height:1.55}
    .bbl.in{background:var(--surface);border-bottom-left-radius:6px;
      box-shadow:0 2px 8px rgba(108,92,231,.06)}
    .bbl.out{background:linear-gradient(135deg,var(--violet),var(--violet-dark));
      color:#fff;border-bottom-right-radius:6px}
    .bm{font-size:10px;color:var(--muted);margin-top:4px;text-align:right}
    .ai{font-size:10px;font-weight:700;background:rgba(255,122,89,.15);
      color:var(--coral);padding:2px 6px;border-radius:6px;margin-left:5px}

    .send-box{padding:16px 20px;background:var(--surface);
      border-top:1px solid var(--border);display:flex;gap:10px}
    textarea{flex:1;background:var(--surface-2);border:1px solid var(--border);
      border-radius:16px;padding:12px 16px;color:var(--text);
      font-family:inherit;font-size:14px;resize:none;outline:none;
      min-height:44px;max-height:100px;transition:border-color .2s}
    textarea:focus{border-color:var(--violet)}
    .sbtn{background:linear-gradient(135deg,var(--violet),var(--coral));
      border:none;border-radius:16px;
      padding:0 22px;color:#fff;font-weight:700;font-size:14px;cursor:pointer;
      box-shadow:var(--shadow)}
    .sbtn:hover{opacity:.9}

    .welcome{flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;color:var(--muted);gap:10px}
    .welcome h2{color:var(--text);font-size:19px}
    .qr-box{flex:1;display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:18px;color:var(--muted)}
    .qr-box img{width:280px;height:280px;border-radius:20px;background:#fff;padding:14px;
      box-shadow:var(--shadow)}
    .qr-box h2{color:var(--text);font-size:19px}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

    /* Animations */
    @keyframes bubbleIn{
      from{opacity:0;transform:translateY(10px) scale(.97)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    .mw{animation:bubbleIn .28s cubic-bezier(.2,.8,.2,1) both}
    @keyframes dotPulse{
      0%,100%{box-shadow:0 0 0 0 rgba(0,200,150,.4)}
      50%{box-shadow:0 0 0 5px rgba(0,200,150,0)}
    }
    .pill.on::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;
      background:var(--mint);margin-right:2px;animation:dotPulse 1.6s infinite}
    .pill.on{display:flex;align-items:center;gap:5px}
    .sbtn,.theme-btn,.contact,#persona-sel{transition:transform .15s,background .15s,opacity .15s}
    .sbtn:active{transform:scale(.94)}
    .theme-btn:active{transform:scale(.88) rotate(15deg)}
    .contact:hover{transform:translateX(2px)}
    @keyframes typingDot{
      0%,60%,100%{transform:translateY(0);opacity:.4}
      30%{transform:translateY(-4px);opacity:1}
    }
    .typing-bbl{display:inline-flex;gap:4px;padding:14px 18px}
    .typing-bbl span{width:6px;height:6px;border-radius:50%;background:var(--muted);
      animation:typingDot 1.2s infinite}
    .typing-bbl span:nth-child(2){animation-delay:.15s}
    .typing-bbl span:nth-child(3){animation-delay:.3s}
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(8px)}
      to{opacity:1;transform:translateY(0)}
    }
    .welcome,.qr-box{animation:fadeUp .3s ease both}
  </style>
</head>
<body>
<header>
  <div class="brand"><div class="brand-icon"><img src="assets/logo.png" alt="Ali logo"/></div> AI WhatsApp Agent</div>
  <div class="right">
    <span style="color:var(--muted);font-weight:500">Manual</span>
    <label class="toggle">
      <input type="checkbox" id="tog" onchange="toggleAgent()"/>
      <span class="slider"></span>
    </label>
    <span style="color:var(--violet);font-weight:600">AI Agent</span>
    <div class="pill" id="pill">● Offline</div>
    <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="Toggle dark mode">🌙</button>
  </div>
</header>
<div class="main">
  <div class="sidebar">
    <h3>Conversations</h3>
    <div class="clist" id="clist">
      <div class="empty">No messages yet.<br/>Scan the QR code<br/>to connect WhatsApp!</div>
    </div>
  </div>
  <div class="panel" id="panel">
    <div class="welcome">
      <div style="font-size:48px">🤖</div>
      <h2>Select a conversation</h2>
      <p>Messages will appear here automatically</p>
    </div>
  </div>
</div>
<script>
  let sel=null,aiOn=false,waConnected=false,personasList=[];
  let lastStatusKey='';    // tracks last rendered status pill state
  let lastContactsJSON=''; // tracks last rendered contacts list
  let lastMsgCount=-1;     // tracks how many messages are shown for the open chat

  function applyTheme(t){
    document.documentElement.setAttribute('data-theme',t);
    document.getElementById('themeBtn').textContent = t==='dark' ? '☀️' : '🌙';
    localStorage.setItem('theme',t);
  }
  function toggleTheme(){
    const cur = document.documentElement.getAttribute('data-theme')==='dark' ? 'light':'dark';
    applyTheme(cur);
  }
  applyTheme(localStorage.getItem('theme') || 'light');

  async function loadPersonas(){
    if(personasList.length) return;
    personasList = await fetch('/api/personas').then(r=>r.json());
  }

  async function setPersona(phone,persona){
    await fetch('/api/contact-settings',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone,persona})});
  }

  // If WhatsApp disconnects while the dashboard is open, send the user back
  // to the QR/connect screen automatically.
  function redirectToWelcome(){
    window.location.href='/welcome.html';
  }

  // Only touches the DOM when status actually changed
  async function loadStatus(){
    const d=await fetch('/api/status').then(r=>r.json());
    aiOn=d.agentEnabled;
    waConnected=d.waConnected;

    if(!waConnected){
      redirectToWelcome();
      return;
    }

    const key=`${aiOn}|${waConnected}`;
    if(key===lastStatusKey) return;
    lastStatusKey=key;

    document.getElementById('tog').checked=aiOn;
    const p=document.getElementById('pill');
    p.textContent=aiOn?'● AI Active':'● Manual';
    p.className=aiOn?'pill on':'pill';
  }

  // Only touches the DOM when the contact list actually changed
  async function loadContacts(){
    const list=await fetch('/api/contacts').then(r=>r.json());
    const json=JSON.stringify(list);
    if(json===lastContactsJSON) return;
    lastContactsJSON=json;

    const el=document.getElementById('clist');
    if(!list.length){
      el.innerHTML='<div class="empty">No messages yet.<br/>Scan the QR code<br/>to connect WhatsApp!</div>';
      return;
    }
    el.innerHTML=list.map(c=>`
      <div class="contact ${c.phone===sel?'active':''}"
        onclick="openChat('${esc(c.phone)}','${esc(c.name)}')">
        <div class="av">${(c.name||c.phone)[0].toUpperCase()}</div>
        <div class="ci">
          <div class="cn">${esc(c.name)}</div>
          <div class="cp">${esc(c.lastMessage||'No messages')}</div>
        </div>
        <div class="cb">${c.messageCount}</div>
      </div>`).join('');
  }

  function renderMessages(messages){
    return messages.length?messages.map((m,i)=>{
      const out=m.role==='assistant';
      const t=m.timestamp?new Date(m.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
      const delay=Math.min(i,8)*0.03;
      return `<div class="mw ${out?'out':''}" style="animation-delay:${delay}s"><div>
        <div class="bbl ${out?'out':'in'}">${esc(m.content)}</div>
        <div class="bm">${t}${out&&aiOn?'<span class="ai">AI</span>':''}</div>
      </div></div>`;
    }).join(''):'<div style="text-align:center;color:var(--muted);margin-top:30px">No messages yet</div>';
  }

  // Full render — only called when a chat is opened/switched
  async function openChat(phone,name){
    sel=phone; lastContactsJSON=''; loadContacts();
    await loadPersonas();
    const [d,curSetting]=await Promise.all([
      fetch(`/api/chat/${encodeURIComponent(phone)}`).then(r=>r.json()),
      fetch(`/api/contact-settings/${encodeURIComponent(phone)}`).then(r=>r.json())
    ]);
    lastMsgCount=d.messages.length;
    document.getElementById('panel').innerHTML=`
      <div class="chat-head">
        <div class="av">${(name||phone)[0].toUpperCase()}</div>
        <div style="flex:1"><div class="ct">${esc(name)}</div>
          <div class="cph">${phone}</div></div>
        <select id="persona-sel" onchange="setPersona('${esc(phone)}',this.value)">
          ${personasList.map(p=>`<option value="${esc(p.key)}" ${p.key===curSetting.persona?'selected':''}>${esc(p.label)}</option>`).join('')}
        </select>
      </div>
      <div class="msgs" id="msgs">${renderMessages(d.messages)}</div>
      <div class="send-box">
        <textarea id="inp" placeholder="Type a message…"
          onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"
          oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
        <button class="sbtn" onclick="sendMsg()">Send</button>
      </div>`;
    const m=document.getElementById('msgs');
    if(m) m.scrollTop=m.scrollHeight;
  }

  // Lightweight poll for the open chat — only appends NEW messages, never rebuilds the panel
  async function pollMessages(){
    if(!sel || !waConnected) return;
    const msgsEl=document.getElementById('msgs');
    if(!msgsEl) return;

    const d=await fetch(`/api/chat/${encodeURIComponent(sel)}`).then(r=>r.json());
    if(d.messages.length===lastMsgCount) return; // nothing new, skip render (no blink)

    const wasAtBottom = msgsEl.scrollTop + msgsEl.clientHeight >= msgsEl.scrollHeight - 40;
    const newOnes = d.messages.slice(lastMsgCount);
    lastMsgCount = d.messages.length;

    newOnes.forEach(m=>{
      const out=m.role==='assistant';
      const t=m.timestamp?new Date(m.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'}):'';
      msgsEl.insertAdjacentHTML('beforeend',`<div class="mw ${out?'out':''}"><div>
        <div class="bbl ${out?'out':'in'}">${esc(m.content)}</div>
        <div class="bm">${t}${out&&aiOn?'<span class="ai">AI</span>':''}</div>
      </div></div>`);
    });
    if(wasAtBottom) msgsEl.scrollTop=msgsEl.scrollHeight;
  }

  async function sendMsg(){
    const inp=document.getElementById('inp');
    const msg=inp?.value?.trim();
    if(!msg||!sel) return;
    inp.value=''; inp.style.height='auto';
    const msgsEl=document.getElementById('msgs');
    if(msgsEl){
      msgsEl.insertAdjacentHTML('beforeend',`<div class="mw out" id="typingRow"><div class="bbl out typing-bbl"><span></span><span></span><span></span></div></div>`);
      msgsEl.scrollTop=msgsEl.scrollHeight;
    }
    await fetch('/api/send',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({phone:sel,message:msg})});
    document.getElementById('typingRow')?.remove();
    await pollMessages();
  }

  async function toggleAgent(){
    await fetch('/api/toggle',{method:'POST'});
    lastStatusKey=''; // force the pill to re-render immediately
    loadStatus();
  }

  function esc(s){
    return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  loadStatus(); loadContacts();
  setInterval(()=>{
    loadStatus(); loadContacts(); pollMessages();
  },3000);
</script>
</body>
</html>
