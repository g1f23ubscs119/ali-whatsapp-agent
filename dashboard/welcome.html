<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ali — WhatsApp AI Agent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    :root{
      --bg:#0A0B0A;
      --green:#3DDC5B;
      --green-glow:#7CF598;
      --text:#F2FBF4;
      --muted:#8FA396;
    }
    body{
      background:radial-gradient(ellipse at 50% 30%, #10160F 0%, #0A0B0A 65%);
      color:var(--text);height:100vh;overflow:hidden;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:'Inter',system-ui,sans-serif;position:relative;
    }
    /* Ambient floating particles */
    .particle{position:absolute;border-radius:50%;background:var(--green);
      opacity:.35;filter:blur(1px);animation:float 8s ease-in-out infinite}
    .particle:nth-child(1){width:6px;height:6px;top:22%;left:28%;animation-delay:0s}
    .particle:nth-child(2){width:4px;height:4px;top:68%;left:22%;animation-delay:1.5s}
    .particle:nth-child(3){width:8px;height:8px;top:30%;left:74%;animation-delay:.8s}
    .particle:nth-child(4){width:5px;height:5px;top:75%;left:70%;animation-delay:2.3s}
    .particle:nth-child(5){width:3px;height:3px;top:15%;left:55%;animation-delay:3s}
    @keyframes float{
      0%,100%{transform:translateY(0) translateX(0);opacity:.25}
      50%{transform:translateY(-22px) translateX(8px);opacity:.6}
    }

    .glow-ring{position:absolute;width:420px;height:420px;border-radius:50%;
      background:radial-gradient(circle, rgba(61,220,91,.22) 0%, rgba(61,220,91,0) 70%);
      animation:pulseRing 3.2s ease-in-out infinite;
    }
    @keyframes pulseRing{
      0%,100%{transform:scale(1);opacity:.7}
      50%{transform:scale(1.12);opacity:1}
    }

    .logo-wrap{position:relative;z-index:2;opacity:0;
      animation:logoIn .9s cubic-bezier(.2,.9,.25,1) .15s forwards}
    @keyframes logoIn{
      from{opacity:0;transform:translateY(18px) scale(.9)}
      to{opacity:1;transform:translateY(0) scale(1)}
    }
    .logo-wrap img{
      width:132px;height:132px;border-radius:32px;
      box-shadow:0 0 50px rgba(61,220,91,.35), 0 0 120px rgba(61,220,91,.15);
      animation:breathe 3.2s ease-in-out infinite;
    }
    @keyframes breathe{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-8px)}
    }

    h1{font-family:'Sora',system-ui,sans-serif;font-size:38px;font-weight:800;
      margin-top:28px;letter-spacing:.5px;opacity:0;text-align:center;line-height:1.15;
      background:linear-gradient(100deg,#3DDC5B 0%,#B9FFC9 25%,#3DDC5B 50%,#B9FFC9 75%,#3DDC5B 100%);
      background-size:300% auto;
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
      filter:drop-shadow(0 0 22px rgba(61,220,91,.45));
      animation:fadeUp .7s ease .5s forwards, shimmer 4.5s linear 1.2s infinite;
      z-index:2}
    @keyframes shimmer{
      to{background-position:-300% center}
    }
    h1 span{display:block;font-size:15px;font-weight:600;letter-spacing:3px;
      color:var(--green-glow);-webkit-text-fill-color:var(--green-glow);
      text-transform:uppercase;margin-top:6px;filter:none}
    p.tag{color:var(--muted);font-size:14px;margin-top:8px;opacity:0;
      animation:fadeUp .7s ease .7s forwards;z-index:2}
    @keyframes fadeUp{
      from{opacity:0;transform:translateY(12px)}
      to{opacity:1;transform:translateY(0)}
    }

    .enter-btn{
      margin-top:38px;padding:14px 36px;border-radius:30px;border:none;
      background:linear-gradient(135deg,var(--green),#26A83E);
      color:#08130A;font-weight:700;font-size:15px;cursor:pointer;
      font-family:'Sora',system-ui,sans-serif;
      box-shadow:0 8px 28px rgba(61,220,91,.35);
      opacity:0;animation:fadeUp .7s ease .95s forwards;
      transition:transform .18s, box-shadow .18s;
      z-index:2;
    }
    .enter-btn:hover{transform:translateY(-2px) scale(1.03);
      box-shadow:0 12px 34px rgba(61,220,91,.5)}
    .qr-card{margin-top:34px;background:rgba(255,255,255,.04);border:1px solid rgba(61,220,91,.25);
      border-radius:24px;padding:22px 26px;display:flex;flex-direction:column;align-items:center;gap:10px;
      opacity:0;animation:fadeUp .7s ease 1.15s forwards;z-index:2;
      box-shadow:0 0 40px rgba(61,220,91,.12)}
    .qr-card img{width:150px;height:150px;border-radius:14px;background:#fff;padding:8px}
    .qr-card p{font-size:12px;color:var(--muted);text-align:center;max-width:200px}
    .enter-btn:active{transform:scale(.96)}
  </style>
</head>
<body>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="particle"></div>
  <div class="glow-ring"></div>

  <div class="logo-wrap">
    <img src="assets/logo.png" alt="AI WhatsApp Agent logo" />
  </div>
  <h1>AI WhatsApp Agent<span>Jahanzaib Ali</span></h1>
  <p class="tag">Your WhatsApp AI Agent, always on</p>
  <button class="enter-btn" onclick="window.location.href='index.html'">Enter Dashboard →</button>

  <div class="qr-card" id="qrCard">
    <p style="margin-bottom:4px">Loading your connect code…</p>
  </div>

  <script>
    let lastState=null; // tracks what's currently shown, so we only touch the DOM on real change

    async function loadWelcomeQR(){
      const card = document.getElementById('qrCard');
      try{
        const d = await fetch('/api/qr').then(r=>r.json());

        if(d.connected){
          if(lastState!=='connected'){
            lastState='connected';
            card.innerHTML = `<p style="font-size:14px;color:var(--green-glow)">✅ WhatsApp linked — opening dashboard…</p>`;
          }
          window.location.href = 'index.html';
          return;
        }

        const newState = d.qr || 'generating';
        if(newState===lastState) return; // nothing changed, leave QR exactly as-is
        lastState=newState;

        if(d.qr){
          card.innerHTML = `
            <img src="${d.qr}" alt="Scan to link your WhatsApp" />
            <p>Scan with <b>your own</b> WhatsApp → Linked Devices, to connect your account</p>`;
        } else {
          card.innerHTML = `<p>Generating your connect code…</p>`;
        }
      }catch(e){}
    }
    loadWelcomeQR();
    setInterval(loadWelcomeQR, 3000);
  </script>
</body>
</html>
